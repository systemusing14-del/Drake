<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Gallery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>🎌 Anime Image Gallery</h1>
    </header>

    <!-- Upload Section -->
    <section class="upload-section">
        <h2>Upload Anime Image</h2>
        
        <form id="uploadForm">
            <input type="file" id="imageInput" accept="image/*" required>
            
            <!-- Tag input to help validate anime -->
            <input type="text" id="tagInput" placeholder="Enter tag (e.g. anime, naruto)" required>
            
            <button type="submit">Upload</button>
        </form>

        <p class="note">Only anime-related images allowed. Max size: 2MB</p>
    </section>

    <!-- Gallery Section -->
    <section class="gallery" id="gallery">
        <h2>Public Gallery</h2>
        <div class="image-grid" id="imageGrid"></div>
    </section>

    <script src="script.js"></script>
</body>
</html>
