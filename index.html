    <style>
        /* COMPLETE CSS - PASTED HERE FOR INSTANT LOADING */
        *{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}:root{--bg-primary:#0a0a1a;--bg-gradient:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);--glass-bg:rgba(255,255,255,.1);--glass-border:rgba(255,255,255,.2);--neon-pink:#ff6b9d;--neon-cyan:#4ecdc4;--neon-purple:#a855f7;--text-primary:#fff;--text-secondary:#b0b3d6;--shadow-neon:0 0 30px rgba(255,107,157,.3);--shadow-glow:0 0 20px rgba(78,205,196,.2);--radius:20px;--transition:all .4s cubic-bezier(.4,0,.2,1)}[data-theme=light]{--bg-primary:#f8fafc;--glass-bg:rgba(255,255,255,.9);--text-primary:#1e293b;--text-secondary:#64748b;--shadow-neon:0 10px 30px rgba(0,0,0,.2)}body{font-family:'Inter',sans-serif;background:var(--bg-gradient);color:var(--text-primary);line-height:1.7;overflow-x:hidden;position:relative}.container{max-width:1400px;margin:0 auto;padding:0 2rem}.section{padding:100px 0}.section-title{font-family:'Orbitron',monospace;font-size:clamp(2.5rem,5vw,4rem);text-align:center;background:linear-gradient(45deg,var(--neon-pink),var(--neon-cyan),var(--neon-purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:1rem;letter-spacing:2px}.section-subtitle{font-size:1.2rem;color:var(--text-secondary);text-align:center;max-width:600px;margin:0 auto 3rem}

/* Header */
.header{position:fixed;top:0;left:0;right:0;z-index:1000;background:linear-gradient(180deg,rgba(10,10,26,.95),rgba(26,26,46,.9));backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border)}.navbar{display:flex;justify-content:space-between;align-items:center;padding:1.5rem 2rem}.nav-brand{display:flex;align-items:center;gap:1rem;font-size:1.5rem;font-weight:800;color:var(--neon-pink);text-decoration:none}.nav-brand i{font-size:2rem;animation:pulse 2s infinite}.nav-menu{display:flex;list-style:none;gap:2rem;align-items:center}.nav-link{color:var(--text-secondary);text-decoration:none;font-weight:500;padding:.5rem 1rem;border-radius:12px;transition:var(--transition);position:relative}.nav-link:hover,.nav-link.active{color:var(--text-primary);background:var(--glass-bg);box-shadow:var(--shadow-glow)}.nav-actions{display:flex;align-items:center;gap:1rem}.search-box{display:flex;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:25px;padding:.5rem;overflow:hidden}.search-box input{background:none;border:none;color:var(--text-primary);padding:.5rem 1rem;width:200px;font-family:inherit}.search-box i{color:var(--text-secondary);padding:.5rem}.theme-toggle{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:50%;width:50px;height:50px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:var(--transition)}.hamburger{display:none;flex-direction:column;width:30px;height:25px;background:none;border:none;cursor:pointer;gap:4px}.hamburger span{height:3px;width:100%;background:var(--neon-pink);border-radius:2px;transition:var(--transition);transform-origin:left}

/* Hero */
.hero{min-height:100vh;display:flex;align-items:center;padding-top:80px;background:var(--bg-gradient);position:relative;overflow:hidden}.hero::before{content:'';position:absolute;top:0;left:0;right:0;height:400px;background:radial-gradient(circle at 30% 20%,rgba(255,107,157,.3) 0%,transparent 50%),radial-gradient(circle at 80% 80%,rgba(78,205,196,.2) 0%,transparent 50%);animation:float 20s ease-in-out infinite}.hero-content{display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:center;max-width:1400px;margin:0 auto;padding:0 2rem}.hero-text{text-align:left}.hero-title{font-family:'Orbitron',monospace;font-size:clamp(3rem,8vw,6rem);font-weight:800;line-height:1.1;margin-bottom:1.5rem}.gradient-text{background:linear-gradient(45deg,var(--neon-pink),var(--neon-cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}.hero-subtitle{font-size:1.5rem;color:var(--text-secondary);margin-bottom:3rem;max-width:500px;line-height:1.6}.hero-cta{display:flex;gap:1rem;flex-wrap:wrap}.cta-primary,.cta-secondary{padding:1.2rem 2.5rem;border:none;border-radius:50px;font-size:1.1rem;font-weight:600;cursor:pointer;transition:var(--transition);display:flex;align-items:center;gap:1rem;text-decoration:none}.cta-primary{background:linear-gradient(45deg,var(--neon-pink),var(--neon-purple));color:white;box-shadow:var(--shadow-neon)}.cta-secondary{background:transparent;border:2px solid var(--neon-cyan);color:var(--neon-cyan)}.cta-primary:hover{transform:translateY(-5px) scale(1.05);box-shadow:0 20px 40px rgba(255,107,157,.4)}.hero-stats{display:flex;gap:2rem;flex-wrap:wrap;justify-content:center}.stat-card{background:var(--glass-bg);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:var(--radius);padding:2rem;text-align:center;min-width:150px;transition:var(--transition)}.stat-card:hover{transform:translateY(-10px);box-shadow:var(--shadow-glow)}.stat-number{font-size:2.5rem;font-weight:800;color:var(--neon-pink);display:block;font-family:'Orbitron',monospace}.stat-label{color:var(--text-secondary);font-size:.9rem;font-weight:500}

/* Articles */
.articles-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:2rem}.article-card{background:var(--glass-bg);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:var(--transition);position:relative}.article-card:hover{transform:translateY(-15px) rotateX(5deg) rotateY(5deg);box-shadow:var(--shadow-neon)}.article-media{position:relative;height:220px;overflow:hidden}.article-media img{width:100%;height:100%;object-fit:cover;transition:var(--transition)}.article-overlay{position:absolute;top:1rem;right:1rem;background:var(--glass-bg);backdrop-filter:blur(10px);padding:.5rem 1rem;border-radius:20px;font-size:.8rem;font-weight:600;color:var(--neon-cyan)}.article-body{padding:2rem}.article-body h3{font-size:1.4rem;font-weight:700;margin-bottom:1rem;line-height:1.3}.article-body p{color:var(--text-secondary);margin-bottom:1.5rem;line-height:1.6}.article-footer{display:flex;justify-content:space-between;align-items:center}.rating{font-weight:600;color:var(--neon-pink)}.category{background:var(--neon-purple);color:white;padding:.3rem .8rem;border-radius:20px;font-size:.8rem;font-weight:500}

/* Carousel */
.carousel-container{position:relative;overflow:hidden}.carousel-track{display:flex;transition:transform .5s ease}.carousel-nav{position:absolute;top:50%;transform:translateY(-50%);background:var(--glass-bg);border:1px solid var(--glass-border);color:var(--text-primary);width:50px;height:50px;border-radius:50%;cursor:pointer;transition:var(--transition);z-index:10}.carousel-nav:hover{background:var(--neon-pink);color:white;transform:translateY(-50%) scale(1.1)}.prev{left:0}.next{right:0}

/* Community */
.community-grid{display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:start}.community-card{background:var(--glass-bg);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:var(--radius);padding:2.5rem}.poll-card h3{margin-bottom:1rem;color:var(--neon-cyan);font-size:1.3rem}.poll-card h4{font-size:1.5rem;margin-bottom:2rem}.poll-options{margin-bottom:2rem}.poll-option{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem}.poll-bar{flex:1;height:10px;background:var(--glass-bg);border-radius:5px;overflow:hidden;position:relative}.poll-bar::after{content:'';position:absolute;top:0;left:0;height:100%;background:linear-gradient(90deg,var(--neon-pink),var(--neon-cyan));transition:width 2s ease;width:0%}.activity-feed{display:flex;flex-direction:column;gap:1.5rem}.activity-item{display:flex;gap:1rem;padding:1rem;background:var(--glass-bg);border-radius:12px;border-right:4px solid var(--neon-pink);transition:var(--transition)}.activity-item:hover{transform:translateX(10px)}.activity-avatar{width:40px;height:40px;border-radius:50%;background:var(--neon-purple);color:white;display:flex;align-items:center;justify-content:center;font-weight:700}

/* Newsletter */
.newsletter-section{background:linear-gradient(135deg,rgba(255,107,157,.1),rgba(78,205,196,.1));padding:80px 0}.newsletter-card{background:var(--glass-bg);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:var(--radius);padding:4rem;text-align:center;max-width:600px;margin:0 auto}.newsletter-form{display:flex;max-width:400px;margin:2rem auto 0;gap:1rem;flex-wrap:wrap;justify-content:center}.newsletter-form input{flex:1;min-width:250px;padding:1rem 1.5rem;border:1px solid var(--glass-border);border-radius:50px;background:var(--glass-bg);color:var(--text-primary);font-family:inherit}.newsletter-form button{padding:1rem 2rem;border:none;border-radius:50px;background:linear-gradient(45deg,var(--neon-pink),var(--neon-purple));color:white;font-weight:600;cursor:pointer;transition:var(--transition)}.newsletter-form button:hover{transform:scale(1.05);box-shadow:var(--shadow-neon)}

/* Footer */
.footer{background:var(--glass-bg);backdrop-filter:blur(20px);border-top:1px solid var(--glass-border);padding:3rem 0 1rem}.footer-content{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:2rem}.footer-brand{display:flex;align-items:center;gap:1rem;color:var(--neon-pink);font-weight:700}.footer-links{display:flex;gap:1.5rem}.footer-links a{color:var(--text-secondary);font-size:1.5rem;transition:var(--transition)}.footer-links a:hover{color:var(--neon-cyan);transform:translateY(-3px) rotate(10deg)}

/* Modal */
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:10000;padding:2rem}.modal[aria-hidden=false]{display:flex}.modal-overlay{cursor:pointer}.modal-content{background:var(--glass-bg);backdrop-filter:blur(30px);border:1px solid var(--glass-border);border-radius:var(--radius);max-width:700px;max-height:90vh;overflow-y:auto;width:100%;position:relative;animation:modalSlideIn .3s ease}.modal-close{position:absolute;top:1.5rem;right:1.5rem;background:none;border:none;color:var(--text-secondary);font-size:1.5rem;cursor:pointer;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:var(--transition)}.modal-close:hover{background:var(--neon-pink);color:white}@keyframes modalSlideIn{from{opacity:0;transform:scale(.8) translateY(-50px)}to{opacity:1;transform:scale(1) translateY(0)}}

/* Responsive */
@media (max-width:1024px){.hero-content{grid-template-columns:1fr;gap:3rem;text-align:center}.hero-text order:2}.nav-menu{display:none;flex-direction:column;position:absolute;top:100%;left:0;right:0;background:var(--glass-bg);backdrop-filter:blur(20px);padding:2rem;border-radius:0 0 var(--radius) var(--radius);border-top:1px solid var(--glass-border)}.nav-menu.active{display:flex}.hamburger{display:flex}}@media (max-width:768px){.container{padding:0 1rem}.section{padding:60px 0}.hero{padding-top:100px}.community-grid{grid-template-columns:1fr;gap:2rem}.newsletter-form{flex-direction:column;align-items:center}.newsletter-form input{width:100%;min-width:auto}}

/* Animations */
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:var(--glass-bg)}::-webkit-scrollbar-thumb{background:linear-gradient(var(--neon-pink),var(--neon-cyan));border-radius:4px}::-webkit-scrollbar-thumb:hover{background:var(--neon-purple)}
    </style>
</head>
